upload_port = /dev/cu.usbmodem21401
monitor_port = /dev/cu.usbmodem21401
monitor_speed = 115200
upload_speed = 115200
upload_flags =
	--connect-attempts
	30
board_build.esp-idf.sdkconfig_path = sdkconfig.tf-write-probe-hybrid
build_unflags =
	-Werror=all
build_src_filter =
	-<*>
