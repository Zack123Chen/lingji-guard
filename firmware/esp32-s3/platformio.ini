; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:external-qspi-psram-diag]
platform = espressif32
board = esp32-s3-devkitc-1
framework = 
	arduino
	espidf
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
upload_speed = 115200
upload_flags = 
	--connect-attempts
	30
board_build.arduino.memory_type = qio_qspi
board_build.psram_type = qspi
build_src_filter = 
	+<external_qspi_psram_diag.cpp>
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-Wno-error=parentheses

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework =
	arduino
	espidf
platform_packages =
	platformio/framework-espidf@3.40407.240606
	espressif/toolchain-riscv32-esp@8.4.0+2021r2-patch5
	espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
upload_speed = 115200
upload_flags = 
	--connect-attempts
	30
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32-s3-devkitc-1
build_unflags =
	-Werror=all
build_src_filter = 
	+<*>
	-<external_qspi_psram_diag.cpp>
	-<i2c_sccb_baseline_diag.cpp>
	-<tmp117_integration_diag.cpp>
	-<camera_psram_colorbar_diag.cpp>
	-<camera_grayscale_colorbar_diag.cpp>
	-<camera_idf_gray_stack4096_diag.c>
	-<tf_write_probe.cpp>
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
	adafruit/Adafruit GFX Library @ ^1.12.3
	sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
	olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0

[env:tf-write-probe-hybrid]
